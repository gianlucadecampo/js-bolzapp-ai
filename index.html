<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js" defer></script>
    <title>Bolzapp</title>
</head>

<body>
    <!--Top of the page, info contact, status-->
    <header>
        <section>
            <ul class="flex justify-between items-center m-2">
                <div class="flex gap-5">
                    <li><img src="./assets/ai-avatar.png" alt="AI avatar" class="max-w-18"></li>
                    <li>
                        <div class="flex flex-col gap-4 m-3">
                            <span>Boolean AI</span>
                            <span>Online 🟢</span>
                        </div>
                    </li>
                </div>
                <div class="flex gap-5">
                    <li><i class="bi bi-search"></i></li>
                    <li><i class="bi bi-journal-medical"></i></li>
                    <li><i class="bi bi-three-dots"></i></li>
                </div>
            </ul>
        </section>
    </header>
    <main class="bg-[url('./assets/whatsapp-background.png')] bg-cover bg-center h-[calc(100vh-140px)] overflow-y-auto">
        <!--Chat message section-->
        <section class="messageSpace">

        </section>
    </main>
    <!--Input section-->
    <footer>
        <form action="">
            <input type="text" class="messageText border-2">
            <button class="enterButton" type="submit"><i class="bi bi-arrow-up-circle"></i></button>
        </form>
    </footer>
</body>

</html>
