<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js" defer></script>
    <title>Bolzapp</title>
</head>

<body>
    <!--Top of the page, info contact, status-->
    <header>
        <section>
            <ul>
                <li><img src="./assets/avatar.png" alt="AI avatar"></li>
                <li>
                    <div>
                        <span>Bool AI</span>
                        <span>Online 🟢</span>
                    </div>
                </li>
                <li><i class="bi bi-search"></i></li>
                <li><i class="bi bi-journal-medical"></i></li>
                <li><i class="bi bi-three-dots"></i></li>
            </ul>
        </section>
    </header>
    <main>
        <!--Chat message section-->
        <section class="messageSpace">

        </section>
    </main>
    <!--Input section-->
    <footer>
        <form action="">
            <input type="text" class="messageText">
            <button class="enterButton border-2" type="submit"><i class="bi bi-arrow-up-circle"></i></button>
        </form>
    </footer>
</body>

</html>
